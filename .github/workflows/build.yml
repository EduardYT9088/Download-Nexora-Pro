              public void onBackPressed() {
                  if (fullView != null) {
                      if (fullCb != null) fullCb.onCustomViewHidden();
                      return;
                  }
                  if (web.canGoBack()) { web.goBack(); return; }
                  web.evaluateJavascript("window.nexoraBack ? nexoraBack() : false", value -> {
                      if (!"true".equals(value)) finish();
                  });
              }

