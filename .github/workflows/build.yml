              private static String versionOf(Context app) {
                  String v = YoutubeDL.getInstance().version(app);
                  if (v == null || v.isEmpty()) v = YoutubeDL.getInstance().versionName(app);
                  return nz(v);
              }

              private static String nz(String s) { return s == null ? "" : s; }

              private static String shortErr(Throwable e) {
                  String m = e.getMessage();
                  if (m == null || m.trim().isEmpty()) return e.getClass().getSimpleName();
                  String best = null;
                  for (String line : m.split("\n")) {
                      if (line.contains("ERROR:")) best = line.substring(line.indexOf("ERROR:") + 6).trim();
                  }
                  if (best == null) {
                      String[] lines = m.trim().split("\n");
                      best = lines[lines.length - 1].trim();
                  }
                  return best.length() > 300 ? best.substring(0, 300) + "…" : best;
              }

              private static String cleanName(String n) {
                  if (n == null) return "";
                  return n.replaceAll("[\\\\/:*?\"<>|]+", "_").trim();
              }

              private static String statusName(int st) {
                  switch (st) {
                      case DownloadManager.STATUS_PENDING: return "pending";
                      case DownloadManager.STATUS_RUNNING: return "running";
                      case DownloadManager.STATUS_PAUSED: return "paused";
                      case DownloadManager.STATUS_SUCCESSFUL: return "done";
                      default: return "failed";
                  }
              }

              private static String mimeOf(String path) {
                  String ext = MimeTypeMap.getFileExtensionFromUrl(Uri.fromFile(new File(path)).toString());
                  if (ext == null || ext.isEmpty()) {
                      int i = path.lastIndexOf('.');
                      ext = i >= 0 ? path.substring(i + 1) : "";
                  }
                  String m = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext.toLowerCase());
                  return m != null ? m : "*/*";
              }

              /** Archivos intermedios de yt-dlp (formato suelto, conversión o miniatura). */
              static boolean isWorkFile(String n) {
                  String l = n.toLowerCase();
                  return l.matches(".*\\.f\\d+(-\\d+)?\\.[a-z0-9]+$") || l.contains(".temp.") || l.endsWith(".ytdl")
                      || (l.matches(".*\\[[\\w-]{11}\\]\\.(jpg|jpeg|webp|png)$"));
              }

              private static File outDir() {
                  File d = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Nexora");
                  if (!d.exists()) d.mkdirs();
                  return d;
              }

              /** Carpetas ordenadas: Nexora/Música, Nexora/Videos, Nexora/Imágenes, Nexora/Documentos */
              static final String SUB_MUSIC = "Música", SUB_VIDEO = "Videos", SUB_IMAGE = "Imágenes", SUB_DOCS = "Documentos";
              private static File outDir(String sub) {
                  File d = new File(outDir(), sub);
                  if (!d.exists()) d.mkdirs();
                  return d;
              }
              static String subFor(String name, String mime) {
                  String n = name == null ? "" : name.toLowerCase(), m = mime == null ? "" : mime.toLowerCase();
                  if (m.startsWith("audio/") || n.matches(".*\\.(mp3|m4a|aac|opus|ogg|oga|wav|flac|wma|amr)$")) return SUB_MUSIC;
                  if (m.startsWith("video/") || n.matches(".*\\.(mp4|webm|mkv|3gp|mov|avi|m4v|ts)$")) return SUB_VIDEO;
                  if (m.startsWith("image/") || n.matches(".*\\.(jpg|jpeg|png|webp|gif|bmp|heic)$")) return SUB_IMAGE;
                  if (n.matches(".*\\.(pdf|docx?|xlsx?|pptx?|txt|epub|zip|rar|7z|apk)$")) return SUB_DOCS;
                  return null;   // otros archivos (por ejemplo copias .json de otras apps) se quedan donde están
              }

              /**
               * Ordena una sola vez lo que ya estaba suelto en Download/Nexora y borra restos de descargas viejas
               * (miniaturas y partes que dejaba yt-dlp). Devuelve [{from,to}] para actualizar la lista de la app.
               */
              static JSONArray organizeFolder(Context app) {
                  JSONArray moved = new JSONArray();
                  File root = outDir();
                  File[] fs = root.listFiles();
                  if (fs == null) return moved;
                  long now = System.currentTimeMillis();
                  java.util.List<String> scan = new java.util.ArrayList<>();
                  for (File f : fs) {
                      try {
                          if (!f.isFile()) continue;
                          String n = f.getName();
                          if (n.startsWith(".")) continue;                              // papelera del sistema (.trashed-...)
                          if (now - f.lastModified() < 10 * 60 * 1000) continue;       // algo que se está escribiendo ahora
                          if (isWorkFile(n) || n.endsWith(".part")) {                   // restos de yt-dlp
                              if (f.delete()) scan.add(f.getAbsolutePath());
                              continue;
                          }
                          String sub = subFor(n, null);
                          if (sub == null) continue;
                          File dest = new File(outDir(sub), n);
                          if (dest.exists()) continue;
                          if (f.renameTo(dest)) {
                              moved.put(new JSONObject().put("from", f.getAbsolutePath()).put("to", dest.getAbsolutePath()).put("name", n));
                              scan.add(f.getAbsolutePath()); scan.add(dest.getAbsolutePath());
                          }
                      } catch (Exception ignored) {}
                  }
                  if (!scan.isEmpty()) MediaScannerConnection.scanFile(app, scan.toArray(new String[0]), null, null);
                  return moved;
              }

              // ================= cuenta / cookies =================
              static File cookiesFile(Context c) { return new File(c.getFilesDir(), "cookies.txt"); }

              private void emitAccount(String msg) {
                  try {
                      JSONObject o = new JSONObject().put("type", "account").put("logged", cookiesFile(this).exists());
                      if (msg != null) o.put("msg", msg);
                      emit(o);
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_PICK) {
                      if (resultCode == RESULT_OK && data != null) onPicked(data);
                      return;
                  }
                  if (requestCode == 43) {
                      try { emit(new JSONObject().put("type", "deleted").put("ok", resultCode == RESULT_OK)); } catch (Exception ignored) {}
                      return;
                  }
                  if (requestCode != REQ_COOKIES || resultCode != RESULT_OK || data == null || data.getData() == null) return;
                  File out = cookiesFile(this);
                  try (InputStream in = getContentResolver().openInputStream(data.getData());
                       OutputStream os = new FileOutputStream(out)) {
                      byte[] buf = new byte[8192]; int n;
                      while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
                  } catch (Exception e) {
                      out.delete();
                  }
                  String txt = "";
                  try { txt = new String(Files.readAllBytes(out.toPath()), StandardCharsets.UTF_8); } catch (Exception ignored) {}
                  if (!txt.contains("youtube.com")) {
                      out.delete();
                      emitAccount("Ese archivo no tiene cookies de YouTube");
                  } else {
                      emitAccount("Sesión importada");
                  }
              }

              private static boolean isYoutube(String url) {
                  try {
                      String h = Uri.parse(url).getHost();
                      if (h == null) return false;
                      h = h.toLowerCase();
                      return h.endsWith("youtube.com") || h.equals("youtu.be") || h.endsWith("youtube-nocookie.com");
                  } catch (Exception e) { return false; }
              }

              private static void applyCommon(Context app, YoutubeDLRequest r, int client) {
                  String ea = "youtube:skip=dash,translated_subs";
                  if (client > 0 && client < CLIENTS.length) ea = CLIENTS[client] + ";skip=dash,translated_subs";
                  if (client == FAST) ea = FAST_ARGS + ";skip=dash,translated_subs";
                  r.addOption("--extractor-args", ea);
                  File ck = cookiesFile(app);
                  if (ck.exists()) r.addOption("--cookies", ck.getAbsolutePath());
                  r.addOption("--no-warnings");
                  r.addOption("--socket-timeout", "20");
                  r.addOption("--extractor-retries", "1");
              }

              private static JSONObject lastJson(String out) throws Exception {
                  String[] lines = out.trim().split("\n");
                  for (int i = lines.length - 1; i >= 0; i--) {
                      String l = lines[i].trim();
                      if (l.startsWith("{")) return new JSONObject(l);
                  }
                  throw new Exception("Respuesta vacía del motor");
              }

              private static JSONObject fetchInfo(Context app, String req, String url, int client) throws Exception {
                  YoutubeDLRequest r = new YoutubeDLRequest(url);
                  r.addOption("--no-playlist");
                  r.addOption("--dump-json");
                  r.addOption("--ignore-no-formats-error");
                  applyCommon(app, r, client);
                  String pid = req + "_" + client;
                  INFO_PID.put(req, pid);
                  // Si tarda demasiado se corta y se prueba el siguiente método
                  ScheduledFuture<?> watchdog = TIMER.schedule(
                      () -> { YoutubeDL.getInstance().destroyProcessById(pid); }, client == FAST ? 25 : INFO_TIMEOUT_S, TimeUnit.SECONDS);
                  try {
                      YoutubeDLResponse res = YoutubeDL.getInstance().execute(r, pid);
                      return lastJson(res.getOut());
                  } catch (YoutubeDL.CanceledException e) {
                      if (CANCELLED_INFO.contains(req)) throw e;
                      throw new Exception("El análisis tardó demasiado");
                  } finally {
                      watchdog.cancel(false);
                      INFO_PID.remove(req);
                  }
              }

              private static void fillInfo(JSONObject o, JSONObject j, String url, JSONObject media, JSONArray fm, int c) throws Exception {
                  String up = j.optString("channel", "");
                  if (up.isEmpty()) up = j.optString("uploader", "");
                  if (up.isEmpty()) up = j.optString("uploader_id", "");
                  String desc = j.optString("description", "");
                  if (desc.length() > 5000) desc = desc.substring(0, 5000) + "…";
                  o.put("streams", media.getJSONArray("streams"))
                   .put("audio", media.optString("audio", ""))
                   .put("audioUa", media.optString("audioUa", ""))
                   .put("desc", desc)
                   .put("views", j.optLong("view_count", 0))
                   .put("likes", j.optLong("like_count", 0))
                   .put("subs", j.optLong("channel_follower_count", 0))
                   .put("date", j.optString("upload_date", ""))
                   .put("chUrl", chUrlOf(j));
                  o.put("ok", true)
                   .put("client", c)
                   .put("title", j.optString("title", ""))
                   .put("uploader", up)
                   .put("thumb", j.optString("thumbnail", ""))
                   .put("duration", (int) Math.round(j.optDouble("duration", 0)))
                   .put("url", j.optString("webpage_url", url))
                   .put("formats", fm);
              }

              private static void emitStage(String req, String stage) {
