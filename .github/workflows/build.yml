                  java.util.List<Uri> uris = new java.util.ArrayList<>();
                  if (data.getClipData() != null) for (int i = 0; i < data.getClipData().getItemCount(); i++) uris.add(data.getClipData().getItemAt(i).getUri());
                  else if (data.getData() != null) uris.add(data.getData());
                  POOL.execute(() -> {
                      JSONArray arr = new JSONArray();
                      for (Uri u : uris) {
                          try {
                              String id = "f" + System.nanoTime();
                              PICKED.put(id, u);
                              String thumb = "";
                              try {
                                  android.graphics.Bitmap bm = null;
                                  if (Build.VERSION.SDK_INT >= 29) bm = getContentResolver().loadThumbnail(u, new android.util.Size(200, 200), null);
                                  else {
                                      android.graphics.BitmapFactory.Options op = new android.graphics.BitmapFactory.Options();
                                      op.inSampleSize = 8;
                                      try (InputStream in = getContentResolver().openInputStream(u)) { bm = android.graphics.BitmapFactory.decodeStream(in, null, op); }
                                  }
                                  if (bm != null) {
                                      java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                                      bm.compress(android.graphics.Bitmap.CompressFormat.JPEG, 75, bo);
                                      thumb = "data:image/jpeg;base64," + android.util.Base64.encodeToString(bo.toByteArray(), android.util.Base64.NO_WRAP);
                                  }
                              } catch (Exception ignored) {}
                              String type = getContentResolver().getType(u);
                              arr.put(new JSONObject().put("id", id).put("thumb", thumb).put("video", type != null && type.startsWith("video/")));
                          } catch (Exception ignored) {}
                      }
                      try { emit(new JSONObject().put("type", "picked").put("items", arr)); } catch (Exception ignored) {}
                  });
              }

