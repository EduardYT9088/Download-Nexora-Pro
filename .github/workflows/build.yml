                  /** Igual que ytInfo pero primero prueba un método rápido (sin descargar el reproductor de YouTube). */
                  @JavascriptInterface
                  public void ytInfoFast(String req, String url) { infoJob(req, url, true, true); }

                  private void infoJob(String req, String url, boolean fast, boolean useNp) {
                      final Context app = getApplicationContext();
                      POOL.execute(() -> {
                          JSONObject o = new JSONObject();
                          try {
                              o.put("type", "info").put("req", req);
                              // 1) Motor rápido (1-2 s, sin Python)
                              if (useNp && isYoutube(url)) {
                                  try {
                                      ensureNp();
                                      JSONObject j = NP.info(url);
                                      if (CANCELLED_INFO.remove(req)) return;
                                      boolean playable = j.optJSONArray("streams").length() > 0 || !j.optString("hls").isEmpty() || !j.optString("audio").isEmpty();
                                      if (playable) { j.put("type", "info").put("req", req); emit(j); return; }
                                  } catch (Throwable e) {
                                      if (CANCELLED_INFO.remove(req)) return;
                                      String m = shortErr(e);
                                      if (shouldStop(m) || m.toLowerCase().contains("unavailable") && !m.toLowerCase().contains("country")) {
                                          // video privado o eliminado: no vale la pena esperar a yt-dlp
                                          o.put("ok", false).put("error", m);
                                          emit(o);
                                          return;
                                      }
                                  }
                                  emitStage(req, "retry");
                              }
                              // 2) yt-dlp (respaldo)
                              awaitEngine();
                              int n = isYoutube(url) ? CLIENTS.length : 1;
                              String lastErr = null;
                              if (fast && isYoutube(url)) {
                                  try {
                                      JSONObject j = fetchInfo(app, req, url, FAST);
                                      JSONObject media = streamsOf(j.optJSONArray("formats"));
                                      if (media.getJSONArray("streams").length() > 0) {
                                          JSONArray fm = condense(j.optJSONArray("formats"));
                                          fillInfo(o, j, url, media, fm, 0);
                                          o.put("fast", true);
                                          emit(o);
                                          return;
                                      }
                                  } catch (YoutubeDL.CanceledException ce) {
                                      if (CANCELLED_INFO.remove(req)) return;
                                  } catch (Throwable ignored) { /* sigue con el método normal */ }
                              }
                              for (int round = 0; round < 2; round++) {
                                  for (int c = 0; c < n; c++) {
                                      try {
                                          if (CANCELLED_INFO.contains(req)) return;
                                          if (c > 0 || round > 0) emitStage(req, "retry");
                                          JSONObject j = fetchInfo(app, req, url, c);
                                          JSONArray fm = condense(j.optJSONArray("formats"));
                                          if (fm.length() == 0 && j.optString("url", "").isEmpty()) {
                                              lastErr = "Requested format is not available";
                                              continue;
                                          }
                                          fillInfo(o, j, url, streamsOf(j.optJSONArray("formats")), fm, c);
                                          emit(o);
                                          return;
                                      } catch (YoutubeDL.CanceledException ce) {
                                          CANCELLED_INFO.remove(req);
                                          return;
                                      } catch (Throwable e) {
                                          lastErr = shortErr(e);
                                          if (shouldStop(lastErr)) break;
                                      }
                                  }
                                  if (lastErr != null && shouldStop(lastErr)) break;
                                  // Si todo falló, actualizar el motor una vez y volver a intentar
                                  if (round == 0 && !CANCELLED_INFO.contains(req) && autoUpdateAllowed(app)) { emitStage(req, "update"); updateNow(app); } else break;
                              }
                              if (CANCELLED_INFO.remove(req)) return;
                              o.put("ok", false).put("error", lastErr != null ? lastErr : "Error desconocido");
                          } catch (Throwable e) {
                              try { o.put("ok", false).put("error", shortErr(e)); } catch (Exception ignored) {}
                          }
                          emit(o);
                      });
                  }

                  @JavascriptInterface
                  public void ytSearch(String req, String query, int count, int start) {
                      final Context app = getApplicationContext();
                      POOL.execute(() -> {
                          JSONObject o = new JSONObject();
                          try {
                              o.put("type", "search").put("req", req);
                              try {
                                  ensureNp();
                                  JSONObject j = NP.search(query, Math.max(1, start), Math.max(5, Math.min(count, 40)));
                                  if (j.getJSONArray("items").length() > 0 || start > 1) { j.put("type", "search").put("req", req); emit(j); return; }
                              } catch (Throwable ignored) { /* sigue con yt-dlp */ }
                              awaitEngine();
                              int n = Math.max(5, Math.min(count, 30));
                              int from = Math.max(1, start);
                              int to = from + n - 1;
                              YoutubeDLRequest r = new YoutubeDLRequest("ytsearch" + to + ":" + query);
                              r.addOption("--flat-playlist");
                              if (from > 1) r.addOption("--playlist-items", from + "-" + to);
                              r.addOption("--dump-single-json");
                              File ck = cookiesFile(app);
                              if (ck.exists()) r.addOption("--cookies", ck.getAbsolutePath());
                              r.addOption("--no-warnings");
                              JSONObject j = lastJson(YoutubeDL.getInstance().execute(r).getOut());
                              JSONArray ent = j.optJSONArray("entries");
                              JSONArray items = new JSONArray();
                              if (ent != null) for (int i = 0; i < ent.length(); i++) {
                                  JSONObject e = ent.optJSONObject(i);
                                  if (e == null) continue;
                                  String id = e.optString("id", "");
                                  if (id.isEmpty()) continue;
                                  String ch = e.optString("channel", "");
                                  if (ch.isEmpty()) ch = e.optString("uploader", "");
                                  String eu = e.optString("url", "");
                                  // Canales y playlists ya no se muestran como videos sin imagen
                                  if (id.startsWith("UC") && id.length() == 24 || eu.contains("/channel/") || eu.contains("/@")) {
                                      items.put(new JSONObject().put("kind", "ch").put("url", eu.isEmpty() ? "https://www.youtube.com/channel/" + id : eu)
                                          .put("title", e.optString("title", ch)).put("channel", e.optString("title", ch))
                                          .put("chUrl", eu.isEmpty() ? "https://www.youtube.com/channel/" + id : eu)
                                          .put("thumb", lastThumb(e)).put("subs", e.optLong("channel_follower_count", 0)));
                                      continue;
                                  }
                                  if (eu.contains("list=") || id.startsWith("PL") || id.startsWith("RD") || id.startsWith("OL")) {
                                      items.put(new JSONObject().put("kind", "pl").put("url", eu.startsWith("http") ? eu : "https://www.youtube.com/playlist?list=" + id)
                                          .put("title", e.optString("title", "")).put("channel", ch).put("thumb", lastThumb(e))
                                          .put("count", e.optInt("playlist_count", 0)).put("mix", id.startsWith("RD")));
                                      continue;
                                  }
                                  items.put(new JSONObject()
                                      .put("kind", "video")
                                      .put("url", "https://www.youtube.com/watch?v=" + id)
                                      .put("title", e.optString("title", ""))
                                      .put("channel", ch)
                                      .put("duration", e.optDouble("duration", 0))
                                      .put("views", e.optLong("view_count", 0))
                                      .put("thumb", "https://i.ytimg.com/vi/" + id + "/mqdefault.jpg")
                                      .put("chUrl", chUrlOf(e)));
                              }
                              o.put("ok", true).put("items", items);
                          } catch (Throwable e) {
                              try { o.put("ok", false).put("error", shortErr(e)); } catch (Exception ignored) {}
                          }
                          emit(o);
                      });
                  }

                  /** Lista de un canal (videos, shorts, en vivo, playlists) o de una playlist. */
                  @JavascriptInterface
                  public void ytList(String req, String url, int start, int count) {
                      final Context app = getApplicationContext();
                      POOL.execute(() -> {
                          JSONObject o = new JSONObject();
                          try {
                              o.put("type", "list").put("req", req);
                              if (isYoutube(url)) {
                                  try {
                                      ensureNp();
                                      int n = Math.max(5, Math.min(count, 40));
                                      JSONObject j = url.contains("list=") ? NP.playlist(url, Math.max(1, start), n) : NP.channel(url, Math.max(1, start), n);
                                      if (j.optBoolean("ok") || j.optBoolean("notab")) { j.put("type", "list").put("req", req); emit(j); return; }
                                  } catch (Throwable ignored) { /* sigue con yt-dlp */ }
                              }
                              awaitEngine();
                              int from = Math.max(1, start), to = from + Math.max(5, Math.min(count, 40)) - 1;
                              JSONObject j = null;
                              Throwable last = null;
                              for (int attempt = 0; attempt < 2 && j == null; attempt++) {
                                  YoutubeDLRequest r = new YoutubeDLRequest(url);
                                  r.addOption("--flat-playlist");
                                  r.addOption("--dump-single-json");
                                  r.addOption("--playlist-items", from + "-" + to);
                                  File ck = cookiesFile(app);
                                  if (attempt == 0 && ck.exists()) r.addOption("--cookies", ck.getAbsolutePath());
                                  if (attempt == 1) r.addOption("--extractor-args", "youtubetab:skip=authcheck");
                                  r.addOption("--no-warnings");
                                  r.addOption("--socket-timeout", "20");
                                  r.addOption("--extractor-retries", "2");
                                  try { j = lastJson(YoutubeDL.getInstance().execute(r).getOut()); }
                                  catch (Throwable e) {
                                      last = e;
                                      String m = String.valueOf(e.getMessage()).toLowerCase();
                                      if (m.contains("does not have a") || m.contains("no tiene")) break;
                                  }
                              }
                              if (j == null) {
                                  String m = last != null ? shortErr(last) : "";
                                  o.put("ok", false).put("error", m).put("notab", m.toLowerCase().contains("does not have a"));
                                  emit(o);
                                  return;
                              }
                              String chName = j.optString("channel", j.optString("uploader", ""));
                              JSONArray ent = j.optJSONArray("entries");
                              JSONArray items = new JSONArray();
                              if (ent != null) for (int i = 0; i < ent.length(); i++) {
                                  JSONObject e = ent.optJSONObject(i);
                                  if (e == null) continue;
                                  String id = e.optString("id", "");
                                  String eu = e.optString("url", "");
                                  String ie = e.optString("ie_key", "");
                                  boolean pl = "YoutubeTab".equals(ie) || eu.contains("list=") || id.startsWith("PL") || id.startsWith("OL");
                                  JSONObject it = new JSONObject()
                                      .put("title", e.optString("title", ""))
                                      .put("duration", e.optDouble("duration", 0))
                                      .put("views", e.optLong("view_count", 0))
                                      .put("channel", e.optString("channel", chName))
                                      .put("kind", pl ? "pl" : "video");
                                  if (pl) {
                                      it.put("url", eu.startsWith("http") ? eu : "https://www.youtube.com/playlist?list=" + id);
                                      it.put("thumb", lastThumb(e));
                                      it.put("count", e.optInt("playlist_count", 0));
                                  } else {
                                      if (id.isEmpty()) continue;
                                      it.put("url", eu.contains("/shorts/") ? eu : "https://www.youtube.com/watch?v=" + id);
                                      it.put("thumb", "https://i.ytimg.com/vi/" + id + "/mqdefault.jpg");
                                      it.put("short", eu.contains("/shorts/"));
                                  }
                                  items.put(it);
                              }
                              String avatar = "", banner = "";
                              JSONArray th = j.optJSONArray("thumbnails");
                              if (th != null) for (int i = 0; i < th.length(); i++) {
                                  JSONObject t = th.optJSONObject(i);
                                  if (t == null) continue;
                                  String tid = t.optString("id", "");
                                  if (tid.equals("avatar_uncropped")) avatar = t.optString("url", "");
                                  if (tid.equals("banner_uncropped")) banner = t.optString("url", "");
                              }
                              String desc = j.optString("description", "");
                              if (desc.length() > 3000) desc = desc.substring(0, 3000) + "…";
                              o.put("ok", true)
                               .put("title", j.optString("title", chName))
                               .put("channel", chName)
                               .put("subs", j.optLong("channel_follower_count", 0))
                               .put("desc", desc)
                               .put("avatar", avatar)
                               .put("banner", banner)
                               .put("chUrl", chUrlOf(j))
                               .put("items", items)
                               .put("more", items.length() >= (to - from + 1));
                          } catch (Throwable e) {
                              try { o.put("ok", false).put("error", shortErr(e)); } catch (Exception ignored) {}
                          }
                          emit(o);
                      });
                  }

