                  /** Abre con el reproductor elegido. Devuelve ok | missing | error. */
                  @JavascriptInterface
                  public String openMedia(String uri, String path, String dmId, String pkg) {
                      try {
                          Uri u = null;
                          String mime = null;
                          if (dmId != null && !dmId.isEmpty()) {
                              long l = Long.parseLong(dmId);
                              u = dm.getUriForDownloadedFile(l);
                              mime = dm.getMimeTypeForDownloadedFile(l);
                          } else if (uri != null && !uri.isEmpty()) {
                              u = Uri.parse(uri);
                              mime = (path != null && !path.isEmpty()) ? mimeOf(path) : null;
                          }
                          if (u == null) return "error";
                          if (mime == null) mime = "*/*";
                          if (pkg != null && !pkg.isEmpty()) {
                              if (!isInstalled(pkg)) return "missing";
                              Intent i = new Intent(Intent.ACTION_VIEW);
                              i.setDataAndType(u, mime);
                              i.setPackage(pkg);
