name: Build Nexora Download Plus APK

# Se ejecuta al subir cambios a main o manualmente desde la pestaña "Actions".
on:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'keystore/**' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Nexora Download Plus"
  APP_ID: "com.nexora.download"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---------- Proyecto Android (se genera aquí; tú solo subes los HTML) ----------
      - name: Crear proyecto Android
        run: |
          set -e
          P=android
          PK=app/src/main/java/com/nexora/download
          mkdir -p $P/$PK $P/app/src/main/assets $P/app/src/main/res/values \
                   $P/app/src/main/res/drawable $P/app/src/main/res/mipmap-anydpi-v26

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
          }
          rootProject.name = "NexoraDownload"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.nexora.download'
              compileSdk 34

              defaultConfig {
                  applicationId "com.nexora.download"
                  minSdk 26
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
                  versionName System.getenv("VERSION_NAME") ?: "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file("nexora.jks")
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KS_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }

              // Un APK por tipo de procesador (el motor incluye Python y FFmpeg, que pesan)
              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a'
                      universalApk false
                  }
              }

              packaging {
                  jniLibs { useLegacyPackaging true }
              }
          }

          dependencies {
              implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
              implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
              implementation 'androidx.core:core:1.12.0'
              // Motor rápido (Java puro): info, búsqueda, comentarios y playlists en 1-2 s
              implementation 'com.github.TeamNewPipe:NewPipeExtractor:e8f89145a830b4d6cae32412007f24ea8b36c73a'
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <!-- Para saber si el reproductor recomendado está instalado (Android 11+) -->
              <queries>
                  <package android:name="com.nexora.pro" />
                  <package android:name="org.videolan.vlc" />
                  <package android:name="com.mxtech.videoplayer.ad" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="market" />
                  </intent>
              </queries>

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".LoginActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden" />
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.nexora.download.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
                  <service
                      android:name=".AudioService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
                  <service
                      android:name=".NexoraService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p $P/app/src/main/res/xml
          cat > $P/app/src/main/res/xml/file_paths.xml <<'EOF'
          <paths><cache-path name="share" path="share/" /></paths>
          EOF

          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Nexora Plus</string></resources>
          EOF

          cat > $P/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg">#0E1230</color>
              <color name="ic_bg">#2A2F7A</color>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
              </style>
          </resources>
          EOF

          # Icono adaptativo: fondo degradado + "N" con flecha de descarga
          cat > $P/app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="linear" android:startX="0" android:startY="0" android:endX="108" android:endY="108">
                          <item android:offset="0" android:color="#FF1B1F5E" />
                          <item android:offset="0.55" android:color="#FF3B2FA8" />
                          <item android:offset="1" android:color="#FF7A4DF2" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="radial" android:centerX="32" android:centerY="24" android:gradientRadius="80">
                          <item android:offset="0" android:color="#5946E0C4" />
                          <item android:offset="1" android:color="#0046E0C4" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          cat > $P/app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:pivotX="54" android:pivotY="57.5" android:scaleX="0.8" android:scaleY="0.8" android:translateY="-3.5">
                  <path android:pathData="M30,72 V33 L67,68 M67,31 V68 L79,56"
                      android:strokeWidth="9" android:strokeLineCap="round" android:strokeLineJoin="round"
                      android:fillColor="#00000000">
                      <aapt:attr name="android:strokeColor">
                          <gradient android:type="linear" android:startX="0" android:startY="31" android:endX="0" android:endY="72">
                              <item android:offset="0" android:color="#FFFFFFFF" />
                              <item android:offset="1" android:color="#FF7FF3DD" />
                          </gradient>
                      </aapt:attr>
                  </path>
                  <path android:pathData="M31,84 H77" android:strokeColor="#FF46E0C4"
                      android:strokeWidth="7" android:strokeLineCap="round" android:fillColor="#00000000" />
              </group>
          </vector>
          EOF

          cat > $P/app/src/main/res/drawable/ic_mono.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:pivotX="54" android:pivotY="57.5" android:scaleX="0.8" android:scaleY="0.8" android:translateY="-3.5">
                  <path android:pathData="M54,22 A32,32 0 1,1 53.99,22 Z"
                      android:strokeColor="#FFFFFFFF" android:strokeWidth="8" android:fillColor="#00000000" />
                  <path android:pathData="M54,36 V58 M43,50 L54,61 L65,50 M44,71 H64"
                      android:strokeColor="#FFFFFFFF" android:strokeWidth="8"
                      android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" />
              </group>
          </vector>
          EOF

          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
              <monochrome android:drawable="@drawable/ic_mono" />
          </adaptive-icon>
          EOF

      - name: Crear código Java (WebView + motor yt-dlp)
        run: |
          cat > android/app/src/main/java/com/nexora/download/MainActivity.java <<'EOF'
          package com.nexora.download;

          import android.Manifest;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.view.Window;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.MimeTypeMap;
          import android.webkit.URLUtil;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.app.PictureInPictureParams;
          import android.content.res.Configuration;
          import android.util.Rational;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.widget.FrameLayout;
          import android.content.pm.ActivityInfo;
          import android.provider.Settings;
          import android.provider.MediaStore;
          import android.content.ContentUris;
          import android.app.PendingIntent;
          import android.widget.Toast;

          import com.yausername.ffmpeg.FFmpeg;
          import com.yausername.youtubedl_android.YoutubeDL;
          import com.yausername.youtubedl_android.YoutubeDLRequest;
          import com.yausername.youtubedl_android.YoutubeDLResponse;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Set;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.ScheduledFuture;
          import java.util.concurrent.TimeUnit;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;

          import kotlin.Unit;

          public class MainActivity extends Activity {
              private WebView web;
              private DownloadManager dm;
              private volatile String pendingShared = null;
              private volatile boolean pageReady = false;
              private FrameLayout root;
              private View fullView = null;
              private WebChromeClient.CustomViewCallback fullCb = null;
              private long pendingApk = -1;
              // Qué está sonando en el reproductor (para ventana flotante / segundo plano)
              private volatile JSONObject now = new JSONObject();
              private boolean pipJustExited = false;

              // ---- Motor yt-dlp ----
              private static final ExecutorService POOL = Executors.newFixedThreadPool(6);
              private static final ScheduledExecutorService TIMER = Executors.newSingleThreadScheduledExecutor();
              private static final Set<String> CANCELLED_INFO = ConcurrentHashMap.newKeySet();
              private static final ConcurrentHashMap<String, String> INFO_PID = new ConcurrentHashMap<>();
              private static final long INFO_TIMEOUT_S = 60;
              private static volatile String engineStatus = "prep";   // prep | updating | ready | error
              private static volatile String engineVersion = "";
              private static volatile boolean engineStarted = false;
              private static final Set<String> ACTIVE = ConcurrentHashMap.newKeySet();
              private static final int REQ_COOKIES = 42;
              private static final int REQ_MEDIA = 44;
              private static final int REQ_PICK = 45;
              private static final java.util.Map<String, Uri> PICKED = new ConcurrentHashMap<>();

              /** Métodos de YouTube que se prueban en orden cuando uno falla. */
              /** Método rápido para ver videos: cliente sin reproductor JavaScript. */
              private static final int FAST = 99;
              private static final String FAST_ARGS = "youtube:player_client=android_vr;player_skip=webpage,configs";

              private static final String[] CLIENTS = {
                  null,                                                                     // lo que yt-dlp considere mejor
                  "youtube:player_client=default,tv_simply,android_vr,mweb,web_embedded"    // varios a la vez como respaldo
              };
              private static final ConcurrentHashMap<String, Long> lastEmit = new ConcurrentHashMap<>();
              private static volatile MainActivity current = null;   // pantalla visible que recibe los eventos
              private static final android.os.Handler MAIN = new android.os.Handler(android.os.Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  current = this;

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0E1230"));
                  root = new FrameLayout(this);
                  root.addView(web, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  // El reproductor (hls.js) descarga los fragmentos de video desde la página local
                  s.setAllowUniversalAccessFromFileURLs(true);

                  // Pantalla completa para el reproductor de video
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      @SuppressWarnings("deprecation")
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (fullView != null) { callback.onCustomViewHidden(); return; }
                          fullView = view; fullCb = callback;
                          root.addView(view, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                          web.setVisibility(View.GONE);
                          getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }
                      @Override
                      @SuppressWarnings("deprecation")
                      public void onHideCustomView() {
                          if (fullView == null) return;
                          root.removeView(fullView);
                          fullView = null;
                          web.setVisibility(View.VISIBLE);
                          getWindow().getDecorView().setSystemUiVisibility(0);
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                          if (fullCb != null) fullCb.onCustomViewHidden();
                          fullCb = null;
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                          return true;
                      }
                      @Override
                      public void onPageFinished(WebView v, String url) { pageReady = true; }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          String h = u.getHost(), p = u.getPath();
                          if (h == null || p == null || !"GET".equals(req.getMethod()) || !p.startsWith("/embed/")) return null;
                          if (!(h.endsWith("youtube-nocookie.com") || h.endsWith("youtube.com"))) return null;
                          try {
                              HttpURLConnection c = (HttpURLConnection) new URL(u.toString()).openConnection();
                              c.setRequestProperty("Referer", "https://" + getPackageName() + "/");
                              c.setRequestProperty("User-Agent", WebSettings.getDefaultUserAgent(MainActivity.this));
                              String al = req.getRequestHeaders() != null ? req.getRequestHeaders().get("Accept-Language") : null;
                              if (al != null) c.setRequestProperty("Accept-Language", al);
                              c.setConnectTimeout(10000);
                              c.setReadTimeout(15000);
                              int code = c.getResponseCode();
                              if (code >= 300 && code < 400) return null;
                              InputStream in = code < 400 ? c.getInputStream() : c.getErrorStream();
                              String msg = c.getResponseMessage();
                              java.util.Map<String, String> hs = new java.util.HashMap<>();
                              hs.put("Cache-Control", "no-cache");
                              return new WebResourceResponse("text/html", "utf-8", code, (msg == null || msg.isEmpty()) ? "OK" : msg, hs, in);
                          } catch (Exception e) {
                              return null;
                          }
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "NexoraAndroid");
                  web.loadUrl("file:///android_asset/index.html");

                  handleIntent(getIntent());
                  askPermissions();
                  startEngine(false);
                  POOL.execute(MainActivity::ensureNp);
              }

              /** Motor rápido: idioma y país del teléfono para resultados y fechas. */
              private static void ensureNp() {
                  if (NP.ready()) return;
                  java.util.Locale l = java.util.Locale.getDefault();
                  NP.init(l.getLanguage(), l.getCountry());
              }

              @Override
              protected void onDestroy() {
                  pageReady = false;
                  if (current == this) current = null;
                  super.onDestroy();
              }

              private void askPermissions() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  } else if (Build.VERSION.SDK_INT <= 29 &&
                      checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 2);
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
              }

              private void handleIntent(Intent intent) {
                  if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) return;
                  String text = intent.getStringExtra(Intent.EXTRA_TEXT);
                  if (text == null || text.trim().isEmpty()) return;
                  if (pageReady) {
                      web.evaluateJavascript("window.onSharedLink && onSharedLink(" + JSONObject.quote(text) + ")", null);
                  } else {
                      pendingShared = text;
                  }
              }

              // ================= ventana flotante y segundo plano =================
              private void enterPip() {
                  if (Build.VERSION.SDK_INT < 26) return;
                  try {
                      enterPictureInPictureMode(new PictureInPictureParams.Builder().setAspectRatio(new Rational(16, 9)).build());
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  JSONObject n = now;
                  if (!n.optBoolean("playing")) return;
                  // Al salir de la app: solo la música en segundo plano (nunca ventana flotante)
                  if (!n.optString("audio").isEmpty()) {
                      startBg(n.optString("audio"), n.optString("ua"), n.optString("title"), n.optString("artist"), n.optLong("pos"));
                      try { emit(new JSONObject().put("type", "bg").put("state", "started").put("auto", true)); } catch (Exception ignored) {}
                      return;
                  }
                  try { emit(new JSONObject().put("type", "leave")); } catch (Exception ignored) {}
              }

              @Override
              public void onPictureInPictureModeChanged(boolean on, Configuration cfg) {
                  super.onPictureInPictureModeChanged(on, cfg);
                  if (!on) pipJustExited = true;
                  try { emit(new JSONObject().put("type", "pip").put("on", on)); } catch (Exception ignored) {}
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  // Se cerró la ventana flotante: pausar el video
                  if (pipJustExited) {
                      pipJustExited = false;
                      try { emit(new JSONObject().put("type", "pipClosed")); } catch (Exception ignored) {}
                  }
              }

              private void startBg(String url, String ua, String title, String artist, long pos) {
                  Intent i = new Intent(this, AudioService.class).setAction(AudioService.ACT_PLAY)
                      .putExtra("url", url).putExtra("ua", ua).putExtra("title", title)
                      .putExtra("artist", artist).putExtra("pos", pos).putExtra("thumb", now.optString("thumb"));
                  try { if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i); }
                  catch (Exception e) { try { emit(new JSONObject().put("type", "bg").put("state", "error")); } catch (Exception ignored) {} }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  pipJustExited = false;
                  if (web != null && pageReady) web.evaluateJavascript("window.nexoraResume && nexoraResume()", null);
                  emitAccount(null);
                  if (pendingApk >= 0 && canInstall()) { long id = pendingApk; pendingApk = -1; launchInstaller(id); }
              }

              // ================= instalar la app reproductora =================
              private boolean canInstall() {
                  return Build.VERSION.SDK_INT < 26 || getPackageManager().canRequestPackageInstalls();
              }

              private void emitInstall(String state, double pct) {
                  try { emit(new JSONObject().put("type", "install").put("state", state).put("pct", pct)); } catch (Exception ignored) {}
              }

              private void launchInstaller(long id) {
                  try {
                      Uri u = dm.getUriForDownloadedFile(id);
                      if (u == null) { emitInstall("error", 0); return; }
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(u, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                      emitInstall("ready", 100);
                  } catch (Exception e) {
                      emitInstall("error", 0);
                  }
              }

              private void afterApkDownloaded(long id) {
                  if (canInstall()) { launchInstaller(id); return; }
                  pendingApk = id;
                  emitInstall("permission", 100);
                  try {
                      startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getPackageName())));
                  } catch (Exception e) {
                      emitInstall("error", 0);
                  }
              }

