              private static long deleteTree(File f, boolean self) {
                  long n = 0;
                  File[] kids = f.listFiles();
                  if (kids != null) for (File k : kids) n += deleteTree(k, true);
                  if (self) { long len = f.isFile() ? f.length() : 0; if (f.delete()) n += len; }
                  return n;
              }

              private boolean view(Uri u, String mime) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(u, mime);
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(Intent.createChooser(i, null).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }
