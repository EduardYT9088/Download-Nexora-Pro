          cat > android/app/src/main/java/com/nexora/download/AudioService.java <<'EOF'
          package com.nexora.download;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.drawable.Icon;
          import android.media.AudioAttributes;
          import android.media.MediaMetadata;
          import android.media.MediaPlayer;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.net.Uri;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          import org.json.JSONObject;

          import java.util.HashMap;
          import java.util.Map;

          /** Reproduce el audio de un video en segundo plano, con controles en la notificación. */
          public class AudioService extends Service implements MediaPlayer.OnPreparedListener,
                  MediaPlayer.OnCompletionListener, MediaPlayer.OnErrorListener {

              static final String ACT_PLAY = "nexora.PLAY", ACT_TOGGLE = "nexora.TOGGLE", ACT_CLOSE = "nexora.CLOSE";
              private static final String CH = "nexora_audio";
              private static volatile AudioService inst;

              private MediaPlayer mp;
              private MediaSession ms;
              private String title = "", artist = "";
              private long startPos = 0;
              private boolean prepared = false;
              private android.graphics.Bitmap art = null;
              private String artUrl = "";

              // ---- Audio precargado mientras ves el video: al salir de la app suena al instante ----
              private static MediaPlayer pre;
              private static String preUrl = "";
              private static volatile boolean preReady = false;

              static synchronized void preload(Context c, String url, String ua) {
                  if (url != null && url.equals(preUrl) && pre != null) return;
                  if (pre != null) { try { pre.release(); } catch (Exception ignored) {} pre = null; }
                  preUrl = ""; preReady = false;
                  if (url == null || url.isEmpty()) return;
                  try {
                      MediaPlayer p = new MediaPlayer();
                      p.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build());
                      p.setWakeMode(c.getApplicationContext(), PowerManager.PARTIAL_WAKE_LOCK);
                      Map<String, String> headers = new HashMap<>();
                      if (ua != null && !ua.isEmpty()) headers.put("User-Agent", ua);
                      p.setDataSource(c.getApplicationContext(), Uri.parse(url), headers);
                      p.setOnPreparedListener(x -> {
                          synchronized (AudioService.class) { if (x == pre) preReady = true; }
                          AudioService s = inst;
                          if (s != null && s.mp == x && !s.prepared) s.onPrepared(x);
                      });
                      p.setOnErrorListener((x, w, e) -> {
                          synchronized (AudioService.class) { if (x == pre) { pre = null; preUrl = ""; preReady = false; } }
                          AudioService s = inst;
                          if (s != null && s.mp == x) return s.onError(x, w, e);
                          try { x.release(); } catch (Exception ignored) {}
                          return true;
                      });
                      p.prepareAsync();
                      pre = p; preUrl = url;
                  } catch (Exception e) { pre = null; preUrl = ""; }
              }

              /** Toma el audio precargado si es el mismo enlace. */
              private static synchronized MediaPlayer takePre(String url, boolean[] ready) {
                  if (pre == null || url == null || !url.equals(preUrl)) return null;
                  MediaPlayer p = pre; ready[0] = preReady;
                  pre = null; preUrl = ""; preReady = false;
                  return p;
              }

              static long position() {
                  AudioService s = inst;
                  try { return (s != null && s.mp != null && s.prepared) ? s.mp.getCurrentPosition() : -1; }
                  catch (Exception e) { return -1; }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  inst = this;
                  String act = intent != null ? intent.getAction() : null;
                  if (ACT_PLAY.equals(act)) {
                      title = intent.getStringExtra("title");
                      artist = intent.getStringExtra("artist");
                      startPos = intent.getLongExtra("pos", 0);
                      String th = intent.getStringExtra("thumb");
                      if (th != null && !th.isEmpty() && !th.equals(artUrl)) { artUrl = th; art = null; loadArt(th); }
                      showNotification(true);
                      play(intent.getStringExtra("url"), intent.getStringExtra("ua"));
                  } else if (ACT_TOGGLE.equals(act)) {
                      toggle();
                  } else if (ACT_CLOSE.equals(act)) {
                      close();
                  } else {
                      close();
                  }
                  return START_NOT_STICKY;
              }

              private void play(String url, String ua) {
                  releasePlayer();
                  prepared = false;
                  boolean[] ready = {false};
                  MediaPlayer p = takePre(url, ready);
                  if (p != null) {
                      // Ya estaba listo: solo salta al segundo donde ibas y suena
                      mp = p;
                      mp.setOnCompletionListener(this);
                      if (ready[0]) onPrepared(mp);
                      return;
                  }
                  try {
                      mp = new MediaPlayer();
                      mp.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build());
                      mp.setWakeMode(getApplicationContext(), PowerManager.PARTIAL_WAKE_LOCK);
                      Map<String, String> headers = new HashMap<>();
                      if (ua != null && !ua.isEmpty()) headers.put("User-Agent", ua);
                      mp.setDataSource(this, Uri.parse(url), headers);
                      mp.setOnPreparedListener(this);
                      mp.setOnCompletionListener(this);
                      mp.setOnErrorListener(this);
                      mp.prepareAsync();
                  } catch (Exception e) {
                      emit("error");
                      close();
                  }
              }

              @Override
              public void onPrepared(MediaPlayer p) {
                  prepared = true;
                  if (startPos > 0) try {
                      if (Build.VERSION.SDK_INT >= 26) p.seekTo(startPos, MediaPlayer.SEEK_CLOSEST); else p.seekTo((int) startPos);
                  } catch (Exception ignored) {}
                  p.start();
                  updateSession(true);
                  showNotification(true);
                  emit("playing");
              }

              @Override
              public void onCompletion(MediaPlayer p) { close(); }

              @Override
              public boolean onError(MediaPlayer p, int what, int extra) {
                  emit("error");
                  close();
                  return true;
              }

              private void toggle() {
                  if (mp == null || !prepared) return;
                  if (mp.isPlaying()) { mp.pause(); updateSession(false); showNotification(false); emit("paused"); }
                  else { mp.start(); updateSession(true); showNotification(true); emit("playing"); }
              }

              private void close() {
                  releasePlayer();
                  if (ms != null) { ms.setActive(false); ms.release(); ms = null; }
                  stopForeground(true);
                  stopSelf();
                  inst = null;
                  emit("stopped");
              }

              private void releasePlayer() {
                  if (mp != null) { try { mp.release(); } catch (Exception ignored) {} mp = null; }
              }

              private void ensureSession() {
                  if (ms != null) return;
                  ms = new MediaSession(this, "NexoraAudio");
                  ms.setCallback(new MediaSession.Callback() {
                      @Override public void onPlay() { toggle(); }
                      @Override public void onPause() { toggle(); }
                      @Override public void onStop() { close(); }
                  });
                  ms.setActive(true);
              }

              private void updateSession(boolean playing) {
                  ensureSession();
                  MediaMetadata.Builder mb = new MediaMetadata.Builder()
                      .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                      .putString(MediaMetadata.METADATA_KEY_ARTIST, artist);
                  try { if (mp != null && prepared) mb.putLong(MediaMetadata.METADATA_KEY_DURATION, mp.getDuration()); } catch (Exception ignored) {}
                  if (art != null) mb.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, art);
                  ms.setMetadata(mb.build());
                  long pos = 0;
                  try { if (mp != null && prepared) pos = mp.getCurrentPosition(); } catch (Exception ignored) {}
                  ms.setPlaybackState(new PlaybackState.Builder()
                      .setActions(PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE | PlaybackState.ACTION_STOP)
                      .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, pos, 1f).build());
              }

              private PendingIntent action(String act, int code) {
                  return PendingIntent.getService(this, code, new Intent(this, AudioService.class).setAction(act),
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              private void showNotification(boolean playing) {
                  ensureSession();
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(CH) == null) {
                      nm.createNotificationChannel(new NotificationChannel(CH, "Música en segundo plano", NotificationManager.IMPORTANCE_LOW));
                  }
                  PendingIntent open = PendingIntent.getActivity(this, 0,
                      new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, CH)
                      .setSmallIcon(R.drawable.ic_mono)
                      .setContentTitle(title == null || title.isEmpty() ? "Nexora Download Plus" : title)
                      .setContentText(artist == null ? "" : artist)
                      .setContentIntent(open)
                      .setLargeIcon(art)
                      .setOngoing(playing)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .addAction(new Notification.Action.Builder(
                          Icon.createWithResource(this, playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play),
                          playing ? "Pausa" : "Reproducir", action(ACT_TOGGLE, 1)).build())
                      .addAction(new Notification.Action.Builder(
                          Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel), "Cerrar", action(ACT_CLOSE, 2)).build())
                      .setStyle(new Notification.MediaStyle().setMediaSession(ms.getSessionToken()).setShowActionsInCompactView(0, 1))
                      .build();
                  if (Build.VERSION.SDK_INT >= 29) startForeground(2, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  else startForeground(2, n);
              }

              /** Descarga la miniatura del video para la notificación (recortada en cuadrado). */
              private void loadArt(String url) {
                  new Thread(() -> {
                      try {
                          java.net.HttpURLConnection c = (java.net.HttpURLConnection) new java.net.URL(url).openConnection();
                          c.setConnectTimeout(8000); c.setReadTimeout(8000);
                          android.graphics.Bitmap b;
                          try (java.io.InputStream in = c.getInputStream()) { b = android.graphics.BitmapFactory.decodeStream(in); }
                          if (b == null) return;
                          int side = Math.min(b.getWidth(), b.getHeight());
                          android.graphics.Bitmap sq = android.graphics.Bitmap.createBitmap(b, (b.getWidth() - side) / 2, (b.getHeight() - side) / 2, side, side);
                          if (side > 512) sq = android.graphics.Bitmap.createScaledBitmap(sq, 512, 512, true);
                          final android.graphics.Bitmap fin = sq;
                          new android.os.Handler(android.os.Looper.getMainLooper()).post(() -> {
                              if (!url.equals(artUrl) || inst != AudioService.this) return;
                              art = fin;
                              boolean playing = mp != null && prepared && mp.isPlaying();
                              updateSession(playing || !prepared);
                              showNotification(playing || !prepared);
                          });
                      } catch (Exception ignored) {}
                  }).start();
              }

              private static void emit(String state) {
                  try { MainActivity.emitPublic(new JSONObject().put("type", "bg").put("state", state)); } catch (Exception ignored) {}
              }

              @Override
              public void onDestroy() {
                  releasePlayer();
                  if (ms != null) { ms.release(); ms = null; }
                  inst = null;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      # ---------- Icono de la app a partir de icon.png ----------
      - name: Crear icono desde icon.png
        run: |
          if [ ! -f icon.png ]; then echo "Sin icon.png: se usa el icono dibujado."; exit 0; fi
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open("icon.png").convert("RGBA")
          res = "android/app/src/main/res"
          # Capa frontal del icono adaptativo: el logo ocupa 70 de 108 dp (se ve completo en círculo o cuadrado)
          for folder, px in {"mdpi":108, "hdpi":162, "xhdpi":216, "xxhdpi":324, "xxxhdpi":432}.items():
              canvas = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              s = round(px * 70 / 108)
              canvas.alpha_composite(src.resize((s, s), Image.LANCZOS), ((px - s) // 2, (px - s) // 2))
              os.makedirs(f"{res}/mipmap-{folder}", exist_ok=True)
              canvas.save(f"{res}/mipmap-{folder}/ic_launcher_fg.png")
          PY
          cat > android/app/src/main/res/values/icon_bg.xml <<'EOF'
          <resources><color name="icon_bg">#14081F</color></resources>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@mipmap/ic_launcher_fg" />
              <monochrome android:drawable="@drawable/ic_mono" />
          </adaptive-icon>
          EOF
          echo "Icono creado desde icon.png"

      - name: Copiar los HTML a la app
        run: |
          cp index.html android/app/src/main/assets/index.html
          # Reproductor HLS (videos que empiezan en ~1 s y calidad automática hasta 4K)
          if [ -f hls.min.js ]; then cp hls.min.js android/app/src/main/assets/
          else
            curl -fsSL https://registry.npmjs.org/hls.js/-/hls.js-1.7.4.tgz | tar -xz -C /tmp
            cp /tmp/package/dist/hls.min.js android/app/src/main/assets/hls.min.js
          fi
          ls -la android/app/src/main/assets
          if [ -f privacy-policy.html ]; then cp privacy-policy.html android/app/src/main/assets/; fi
          if [ -f icon.png ]; then cp icon.png android/app/src/main/assets/; fi

      # ---------- Firma ----------
      # Para que las actualizaciones se instalen encima de la versión anterior (y para Play Store),
      # crea los secretos KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD.
      # Sin secretos se genera una llave temporal (funciona, pero cambia en cada compilación).
      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/nexora.jks
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KS_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASS=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "Usando la llave de los secretos."
          elif [ -n "$KEYSTORE_PASSWORD" ]; then
            # Llave permanente: se crea una sola vez, protegida con tu contraseña secreta,
            # y se guarda en el repositorio (carpeta keystore/) para usarla siempre.
            if [ ! -f keystore/nexora.jks ]; then
              mkdir -p keystore
              keytool -genkeypair -v -keystore keystore/nexora.jks -storetype PKCS12 -alias nexora \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
                -dname "CN=Eduard Gamer, O=Nexora, C=US"
              git config user.name "github-actions"
              git config user.email "github-actions@users.noreply.github.com"
              git add keystore/nexora.jks
              git commit -m "Llave de firma permanente [skip ci]"
              git push
            fi
            cp keystore/nexora.jks android/app/nexora.jks
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KS_ALIAS=nexora" >> $GITHUB_ENV
            echo "KEY_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "Usando la llave permanente."
          else
            keytool -genkeypair -v -keystore android/app/nexora.jks -alias nexora \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass nexora123 -keypass nexora123 \
              -dname "CN=Eduard Gamer, O=Nexora, C=US"
            echo "KS_PASS=nexora123" >> $GITHUB_ENV
            echo "KS_ALIAS=nexora" >> $GITHUB_ENV
            echo "KEY_PASS=nexora123" >> $GITHUB_ENV
            echo "::warning::Llave temporal. Crea el secreto KEYSTORE_PASSWORD para una firma permanente (necesaria para las actualizaciones)."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Renombrar archivos
        run: |
          mkdir -p out
          V=1.0.${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk   "out/NexoraDownloadPlus-v$V-arm64.apk"
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "out/NexoraDownloadPlus-v$V-arm32.apk"
          ls -la out

      - name: Subir APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NexoraDownloadPlus-APK
          path: out/*.apk

      # ---------- Nueva versión: la app la detecta y pide actualizar ----------
      - name: Preparar novedades
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -f novedades.md ]; then cp novedades.md out/notas.md
          else printf '%s\n' "$MSG" > out/notas.md; fi
          cat out/notas.md

      - name: Publicar versión (Release)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nexora Download Plus V1.0.${{ github.run_number }}
          body_path: out/notas.md
          make_latest: true
          files: out/*.apk
