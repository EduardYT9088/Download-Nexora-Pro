                  /** Descarga el APK de la app reproductora y abre el instalador. */
                  @JavascriptInterface
                  public void installApk(String url, String name) {
                      try {
                          File old = new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "install.apk");
                          if (old.exists()) old.delete();
                          DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                          r.setTitle(name);
                          r.setDescription("Nexora Download Plus");
                          r.setMimeType("application/vnd.android.package-archive");
                          r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE);
                          r.setDestinationInExternalFilesDir(MainActivity.this, Environment.DIRECTORY_DOWNLOADS, "install.apk");
                          final long id = dm.enqueue(r);
                          POOL.execute(() -> {
                              long t0 = System.currentTimeMillis();
                              while (System.currentTimeMillis() - t0 < 15 * 60_000L) {
                                  Cursor c = null;
                                  try {
                                      c = dm.query(new DownloadManager.Query().setFilterById(id));
                                      if (c == null || !c.moveToFirst()) { emitInstall("error", 0); return; }
                                      int st = c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                                      long done = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                                      long total = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                                      if (st == DownloadManager.STATUS_SUCCESSFUL) {
                                          runOnUiThread(() -> afterApkDownloaded(id));
                                          return;
                                      }
                                      if (st == DownloadManager.STATUS_FAILED) { emitInstall("error", 0); return; }
                                      emitInstall("progress", total > 0 ? done * 100.0 / total : 0);
                                  } catch (Exception e) {
                                      emitInstall("error", 0); return;
                                  } finally {
                                      if (c != null) c.close();
                                  }
                                  try { Thread.sleep(700); } catch (InterruptedException ie) { return; }
                              }
                              emitInstall("error", 0);
                          });
                      } catch (Exception e) {
                          emitInstall("error", 0);
                      }
                  }

                  @JavascriptInterface
                  public boolean deleteFile(String uri, String path) {
                      boolean ok = false;
                      try { if (uri != null && !uri.isEmpty()) ok = getContentResolver().delete(Uri.parse(uri), null, null) > 0; } catch (Exception ignored) {}
                      try { if (path != null && !path.isEmpty()) { File f = new File(path); if (f.exists()) ok = f.delete() || ok; } } catch (Exception ignored) {}
                      // Archivos de una instalación anterior: Android pide confirmación para borrarlos
                      if (!ok && Build.VERSION.SDK_INT >= 30 && uri != null && uri.startsWith("content://media")) {
                          final Uri u = Uri.parse(uri);
                          runOnUiThread(() -> {
                              try {
                                  PendingIntent pi = MediaStore.createDeleteRequest(getContentResolver(), java.util.Collections.singletonList(u));
                                  startIntentSenderForResult(pi.getIntentSender(), 43, null, 0, 0, 0);
                              } catch (Exception ignored) {}
                          });
                          return true;
                      }
                      return ok;
                  }

