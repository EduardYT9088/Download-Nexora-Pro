                  /** Lista los archivos de Download/Nexora, incluso de instalaciones anteriores. */
                  @JavascriptInterface
                  public String scanLibrary() {
                      JSONArray arr = new JSONArray();
                      try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              Uri files = MediaStore.Files.getContentUri("external");
                              String[] proj = {MediaStore.MediaColumns._ID, MediaStore.MediaColumns.DISPLAY_NAME,
                                  MediaStore.MediaColumns.SIZE, MediaStore.MediaColumns.MIME_TYPE,
                                  MediaStore.MediaColumns.DATE_ADDED, MediaStore.MediaColumns.RELATIVE_PATH, MediaStore.MediaColumns.DATA};
                              try (Cursor c = getContentResolver().query(files, proj,
                                      MediaStore.MediaColumns.RELATIVE_PATH + " LIKE ?", new String[]{"Download/Nexora/%"},
                                      MediaStore.MediaColumns.DATE_ADDED + " DESC")) {
                                  while (c != null && c.moveToNext()) {
                                      long id = c.getLong(0);
                                      String name = c.getString(1);
                                      String mime = c.getString(3);
                                      if (name == null || name.endsWith(".part") || name.endsWith(".ytdl") || isWorkFile(name)) continue;
                                      String data = c.getString(6);
                                      if (data != null && !new File(data).exists()) continue;   // registro viejo de un archivo borrado
                                      Uri base = files;
                                      if (mime != null && mime.startsWith("video/")) base = MediaStore.Video.Media.EXTERNAL_CONTENT_URI;
                                      else if (mime != null && mime.startsWith("audio/")) base = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;
                                      else if (mime != null && mime.startsWith("image/")) base = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                                      arr.put(new JSONObject()
                                          .put("name", name)
                                          .put("size", c.getLong(2))
                                          .put("mime", mime == null ? "" : mime)
                                          .put("date", c.getLong(4) * 1000)
                                          .put("uri", ContentUris.withAppendedId(base, id).toString())
                                          .put("path", c.getString(6) == null ? "" : c.getString(6)));
                                  }
                              }
                          } else {
                              java.util.List<File> all = new java.util.ArrayList<>();
                              File[] top = outDir().listFiles();
                              if (top != null) for (File t : top) {
                                  if (t.isDirectory()) { File[] in = t.listFiles(); if (in != null) all.addAll(Arrays.asList(in)); }
                                  else all.add(t);
                              }
                              File[] fs = all.toArray(new File[0]);
                              if (fs != null) for (File f : fs) {
                                  if (!f.isFile() || f.getName().endsWith(".part") || isWorkFile(f.getName())) continue;
                                  arr.put(new JSONObject().put("name", f.getName()).put("size", f.length())
                                      .put("mime", mimeOf(f.getAbsolutePath())).put("date", f.lastModified())
                                      .put("uri", Uri.fromFile(f).toString()).put("path", f.getAbsolutePath()));
                              }
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }

