                  @JavascriptInterface
                  public void httpGet(String req, String url) {
                      POOL.execute(() -> {
                          HttpURLConnection con = null;
                          JSONObject o = new JSONObject();
                          try {
                              o.put("type", "http").put("req", req);
                              con = (HttpURLConnection) new URL(url).openConnection();
                              con.setConnectTimeout(10000);
                              con.setReadTimeout(10000);
                              con.setRequestProperty("Accept", "application/vnd.github+json");
                              con.setRequestProperty("User-Agent", "NexoraDownloadPlus");
                              int code = con.getResponseCode();
                              InputStream in = code < 400 ? con.getInputStream() : con.getErrorStream();
                              java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                              if (in != null) { byte[] buf = new byte[8192]; int n; while ((n = in.read(buf)) > 0) bo.write(buf, 0, n); in.close(); }
                              o.put("ok", code < 400).put("status", code).put("body", new String(bo.toByteArray(), StandardCharsets.UTF_8));
                          } catch (Throwable e) {
                              try { o.put("ok", false).put("error", String.valueOf(e.getMessage())); } catch (Exception ignored) {}
                          } finally {
                              if (con != null) con.disconnect();
                          }
                          emit(o);
                      });
                  }

