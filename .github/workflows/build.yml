                  /** Sugerencias de búsqueda mientras escribes. */
                  @JavascriptInterface
                  public void suggest(String req, String q, String lang) {
                      POOL.execute(() -> {
                          HttpURLConnection con = null;
                          try {
                              String u = "https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&hl="
                                  + URLEncoder.encode(lang == null ? "es" : lang, "UTF-8") + "&q=" + URLEncoder.encode(q, "UTF-8");
                              con = (HttpURLConnection) new URL(u).openConnection();
                              con.setConnectTimeout(5000);
                              con.setReadTimeout(5000);
                              byte[] body;
                              try (InputStream in = con.getInputStream()) {
                                  java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                                  byte[] buf = new byte[4096]; int n;
                                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                                  body = bo.toByteArray();
                              }
                              String ct = con.getContentType();
                              String cs = (ct != null && ct.toLowerCase().contains("utf-8")) ? "UTF-8" : "ISO-8859-1";
                              JSONArray arr = new JSONArray(new String(body, cs));
                              JSONArray items = arr.optJSONArray(1);
                              emit(new JSONObject().put("type", "suggest").put("req", req).put("items", items != null ? items : new JSONArray()));
                          } catch (Throwable ignored) {
                          } finally {
                              if (con != null) con.disconnect();
                          }
                      });
                  }

