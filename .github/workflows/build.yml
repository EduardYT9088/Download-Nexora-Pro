              /** Resume los formatos para que la app calcule calidades y tamaños. */
              private static JSONArray condense(JSONArray fs) throws Exception {
                  JSONArray out = new JSONArray();
                  if (fs == null) return out;
                  for (int i = 0; i < fs.length(); i++) {
                      JSONObject f = fs.optJSONObject(i);
                      if (f == null) continue;
                      String vc = f.optString("vcodec", "none"), ac = f.optString("acodec", "none");
                      boolean v = !"none".equals(vc) && !vc.isEmpty(), a = !"none".equals(ac) && !ac.isEmpty();
                      String proto = f.optString("protocol", "");
                      if (!v && !a) continue;
                      if (proto.startsWith("mhtml")) continue;
                      long size = f.optLong("filesize", 0);
                      if (size <= 0) size = f.optLong("filesize_approx", 0);
                      out.put(new JSONObject()
                          .put("h", f.optInt("height", 0))
                          .put("v", v).put("a", a)
                          .put("s", size)
                          .put("e", f.optString("ext", ""))
                          .put("c", vc.startsWith("avc1")));
                  }
                  return out;
              }

              /** Enlaces para ver el video dentro de la app: formatos con audio y video juntos, y el mejor solo audio. */
              private static JSONObject streamsOf(JSONArray fs) throws Exception {
                  JSONObject byH = new JSONObject();
                  String audio = "", audioUa = ""; double bestAbr = -1; boolean audioM4a = false;
                  if (fs != null) for (int i = 0; i < fs.length(); i++) {
                      JSONObject f = fs.optJSONObject(i);
                      if (f == null) continue;
                      String url = f.optString("url", "");
                      if (url.isEmpty()) continue;
                      String vc = f.optString("vcodec", "none"), ac = f.optString("acodec", "none");
                      boolean v = !"none".equals(vc) && !vc.isEmpty(), a = !"none".equals(ac) && !ac.isEmpty();
                      String proto = f.optString("protocol", "");
                      boolean https = proto.equals("https") || proto.equals("http");
                      boolean hls = proto.startsWith("m3u8");
                      if (!https && !hls) continue;
                      if (v && a) {
                          int h = f.optInt("height", 0);
                          if (h <= 0) continue;
                          String key = String.valueOf(h);
                          JSONObject prev = byH.optJSONObject(key);
                          // preferir mp4 directo sobre HLS
                          boolean better = prev == null || (prev.optBoolean("hls") && https)
                              || (prev.optBoolean("hls") == hls && "mp4".equals(f.optString("ext")) && !"mp4".equals(prev.optString("e")));
                          if (better) byH.put(key, new JSONObject().put("h", h).put("url", url).put("hls", hls).put("e", f.optString("ext", "")));
                      } else if (a && !v && https) {
                          boolean m4a = "m4a".equals(f.optString("ext", ""));
                          double abr = f.optDouble("abr", 0);
                          if ((m4a && !audioM4a) || (m4a == audioM4a && abr > bestAbr)) {
                              audio = url; bestAbr = abr; audioM4a = m4a;
                              JSONObject hh = f.optJSONObject("http_headers");
                              audioUa = hh != null ? hh.optString("User-Agent", "") : "";
                          }
                      }
                  }
                  JSONArray streams = new JSONArray();
                  java.util.Iterator<String> it = byH.keys();
                  while (it.hasNext()) streams.put(byH.getJSONObject(it.next()));
                  return new JSONObject().put("streams", streams).put("audio", audio).put("audioUa", audioUa);
              }

              private static String chUrlOf(JSONObject e) {
                  String u = e.optString("channel_url", "");
                  if (u.isEmpty()) u = e.optString("uploader_url", "");
                  if (u.isEmpty() && !e.optString("channel_id", "").isEmpty()) u = "https://www.youtube.com/channel/" + e.optString("channel_id");
                  return u;
              }

              private static String lastThumb(JSONObject e) {
                  JSONArray th = e.optJSONArray("thumbnails");
                  if (th == null || th.length() == 0) return e.optString("thumbnail", "");
                  JSONObject t = th.optJSONObject(th.length() - 1);
                  return t != null ? t.optString("url", "") : "";
              }

              private static boolean shouldStop(String err) {
                  String e = err.toLowerCase();
                  return e.contains("private video") || e.contains("video unavailable") || e.contains("has been removed")
                      || e.contains("unsupported url") || e.contains("is not a valid url") || e.contains("members-only")
                      || e.contains("sign in to confirm your age");
              }

              // ================= motor =================
              private void startEngine(boolean forceUpdate) {
                  if (engineStarted && !forceUpdate) { emitEngine(false, null); return; }
                  engineStarted = true;
                  final Context app = getApplicationContext();
                  POOL.execute(() -> {
                      try {
                          engineStatus = "prep"; emitEngine(false, null);
                          YoutubeDL.getInstance().init(app);
                          FFmpeg.getInstance().init(app);
                          engineVersion = versionOf(app);
                          SharedPreferences sp = app.getSharedPreferences("nexora", 0);
                          long last = sp.getLong("lastUpdate", 0);
                          if (forceUpdate || System.currentTimeMillis() - last > 12L * 3600 * 1000) {
                              String result = updateNow(app);
                              emitEngine(forceUpdate, forceUpdate ? result : "ready");
                          } else {
                              engineStatus = "ready";
                              emitEngine(false, null);
                          }
                      } catch (Throwable e) {
                          engineStatus = "error";
                          emitEngine(false, null);
                      }
                  });
              }

              /** Descarga la última versión de yt-dlp. Devuelve updated | current | error. */
              private static synchronized String updateNow(Context app) {
                  engineStatus = "updating"; emitEngine(false, null);
                  String result = "current";
                  try {
                      YoutubeDL.UpdateStatus st = YoutubeDL.getInstance().updateYoutubeDL(app, YoutubeDL.UpdateChannel.STABLE.INSTANCE);
                      if (st == YoutubeDL.UpdateStatus.DONE) result = "updated";
                      app.getSharedPreferences("nexora", 0).edit().putLong("lastUpdate", System.currentTimeMillis()).apply();
                  } catch (Exception e) {
                      result = "error";
                  }
                  engineVersion = versionOf(app);
                  engineStatus = "ready";
                  emitEngine(false, null);
                  return result;
              }

              /** Actualiza solo si no se intentó en la última hora (para reintentar tras un fallo). */
              private static boolean autoUpdateAllowed(Context app) {
                  if (!ACTIVE.isEmpty()) return false;
                  SharedPreferences sp = app.getSharedPreferences("nexora", 0);
                  long last = sp.getLong("lastAuto", 0);
                  if (System.currentTimeMillis() - last < 3600_000L) return false;
                  sp.edit().putLong("lastAuto", System.currentTimeMillis()).apply();
                  return true;
              }

              private static void awaitEngine() throws Exception {
                  long t0 = System.currentTimeMillis();
                  while (!"ready".equals(engineStatus)) {
                      if ("error".equals(engineStatus)) throw new Exception("No se pudo iniciar el motor de descarga");
                      if (System.currentTimeMillis() - t0 > 180_000) throw new Exception("El motor tardó demasiado en iniciar");
                      Thread.sleep(300);
                  }
              }

              private static void serviceUpdate(Context app) {
                  MAIN.post(() -> {
                      Intent i = new Intent(app, NexoraService.class);
                      try {
                          if (ACTIVE.isEmpty()) {
                              app.stopService(i);
                          } else {
                              i.putExtra("count", ACTIVE.size());
                              if (Build.VERSION.SDK_INT >= 26) app.startForegroundService(i); else app.startService(i);
                          }
                      } catch (Exception ignored) {}
                  });
              }

              /** Portada de la canción dentro del archivo (se ve en cualquier reproductor de música). */
              private static void addCover(YoutubeDLRequest r) {
                  r.addOption("--embed-thumbnail");
                  r.addOption("--convert-thumbnails", "jpg");
                  // Recorta la miniatura a cuadrado, como la portada de un disco
                  r.addOption("--ppa", "ThumbnailsConvertor+FFmpeg_o:-c:v mjpeg -qmin 1 -qscale:v 3 -vf \"crop=min(iw\\,ih):min(iw\\,ih)\"");
              }

              private static void addFormat(YoutubeDLRequest r, String mode, boolean cover) {
                  if (cover && ("mp3".equals(mode) || "m4a".equals(mode))) addCover(r);
                  switch (mode) {
                      case "mp3":
                          r.addOption("-f", "ba/b");
                          r.addOption("-x");
                          r.addOption("--audio-format", "mp3");
                          r.addOption("--audio-quality", "0");
                          break;
                      case "m4a":
                          r.addOption("-f", "ba[ext=m4a]/ba/b");
                          r.addOption("-x");
                          r.addOption("--audio-format", "m4a");
                          break;
                      case "vbest":
                          r.addOption("-f", "bv*[vcodec^=avc1]+ba[ext=m4a]/bv*+ba/b");
                          r.addOption("--merge-output-format", "mp4");
                          break;
                      default: {
                          String h = mode.startsWith("v") ? mode.substring(1) : "720";
                          if (!h.matches("\\d{3,4}")) h = "720";
                          r.addOption("-f",
                              "bv*[height<=" + h + "][vcodec^=avc1]+ba[ext=m4a]/" +
                              "bv*[height<=" + h + "][ext=mp4]+ba[ext=m4a]/" +
                              "bv*[height<=" + h + "]+ba/" +
                              "b[height<=" + h + "]/b");
                          r.addOption("--merge-output-format", "mp4");
                      }
                  }
              }

              private static void runYtDownload(Context app, String key, String url, String mode, int client) {
                  ACTIVE.add(key);
                  serviceUpdate(app);
                  long started = System.currentTimeMillis();
                  File pathFile = new File(app.getCacheDir(), "path_" + key + ".txt");
                  try {
                      awaitEngine();
                      File dir = outDir("mp3".equals(mode) || "m4a".equals(mode) ? SUB_MUSIC : SUB_VIDEO);
                      int[] order;
                      if (isYoutube(url)) {
                          order = new int[CLIENTS.length];
                          order[0] = client;
                          for (int i = 0, k = 1; i < CLIENTS.length; i++) if (i != client) order[k++] = i;
                      } else {
                          order = new int[]{0};
                      }
                      Throwable lastErr = null;
                      boolean ok = false;
                      boolean cover = true;
                      File work = new File(app.getCacheDir(), "trabajo/" + key);
                      work.mkdirs();
                      for (int oi = 0; oi < order.length; oi++) {
                        int c = order[oi];
                        pathFile.delete();
                        YoutubeDLRequest r = new YoutubeDLRequest(url);
                      r.addOption("--no-playlist");
                      r.addOption("--no-mtime");
                      r.addOption("--embed-metadata");          // guarda título, canal y enlace dentro del archivo
                      r.addOption("--windows-filenames");
                      r.addOption("--trim-filenames", "150");
                      r.addOption("--newline");
                      // Los archivos de trabajo (audio original, miniatura, partes) quedan en la carpeta privada de la app;
                      // a Download/Nexora solo llega el archivo final, así no aparecen copias ni imágenes sueltas.
                      r.addOption("-P", "home:" + dir.getAbsolutePath());
                      r.addOption("-P", "temp:" + work.getAbsolutePath());
                      r.addOption("-o", "%(title)s - %(uploader|Desconocido)s [%(id)s].%(ext)s");
                      addFormat(r, mode, cover);
                      applyCommon(app, r, c);
                      List<String> extra = Arrays.asList("--print-to-file", "after_move:filepath", pathFile.getAbsolutePath());
                      r.addCommands(extra);

                        try {
                      YoutubeDL.getInstance().execute(r, key, (progress, eta, line) -> {
                          long now = System.currentTimeMillis();
                          Long prev = lastEmit.get(key);
                          if (prev == null || now - prev > 500) {
                              lastEmit.put(key, now);
                              try {
                                  JSONObject o = new JSONObject();
                                  o.put("type", "progress").put("key", key).put("pct", progress).put("eta", eta);
                                  emit(o);
                              } catch (Exception ignored) {}
                          }
                          return Unit.INSTANCE;
                      });
                          ok = true;
                          break;
                        } catch (YoutubeDL.CanceledException ce) {
                          throw ce;
                        } catch (Throwable e) {
                          lastErr = e;
                          String low = String.valueOf(e.getMessage()).toLowerCase();
                          // Si solo falló poner la portada, se repite sin portada (el audio ya está bajado)
                          if (cover && (low.contains("thumbnail") || low.contains("postprocessing") || low.contains("atomicparsley") || low.contains("mutagen"))) {
                              cover = false; oi--; continue;
                          }
                          if (shouldStop(shortErr(e))) break;
                        }
                      }
                      if (!ok) throw (lastErr != null ? lastErr : new Exception("No se pudo descargar"));

                      String path = null;
                      if (pathFile.exists()) {
                          String txt = new String(Files.readAllBytes(pathFile.toPath()), StandardCharsets.UTF_8).trim();
                          String[] lines = txt.split("\n");
                          path = lines[lines.length - 1].trim();
                      }
                      if (path == null || path.isEmpty() || !new File(path).exists()) {
                          File newest = null;
                          File[] files = dir.listFiles();
                          if (files != null) for (File f : files) {
                              if (f.isFile() && f.lastModified() >= started - 5000 && !f.getName().endsWith(".part")
                                  && (newest == null || f.lastModified() > newest.lastModified())) newest = f;
                          }
                          if (newest == null) throw new Exception("No se encontró el archivo descargado");
                          path = newest.getAbsolutePath();
                      }
                      deleteTree(work, true);
                      final String finalPath = path;
                      final long size = new File(finalPath).length();
                      MediaScannerConnection.scanFile(app, new String[]{finalPath},
                          new String[]{mimeOf(finalPath)}, (p, uri) -> {
                              try {
                                  JSONObject o = new JSONObject();
                                  o.put("type", "done").put("key", key).put("path", finalPath)
                                   .put("uri", uri != null ? uri.toString() : "").put("size", size)
                                   .put("file", new File(finalPath).getName());
                                  emit(o);
                              } catch (Exception ignored) {}
                          });
                  } catch (YoutubeDL.CanceledException e) {
                      try { emit(new JSONObject().put("type", "cancelled").put("key", key)); } catch (Exception ignored) {}
                  } catch (Throwable e) {
                      try { emit(new JSONObject().put("type", "error").put("key", key).put("error", shortErr(e))); } catch (Exception ignored) {}
                  } finally {
                      pathFile.delete();
                      lastEmit.remove(key);
                      ACTIVE.remove(key);
                      serviceUpdate(app);
                  }
              }

              /** Funciones disponibles desde JavaScript como window.NexoraAndroid */
              public class Bridge {
                  // ---------- enlaces directos (gestor de descargas de Android) ----------
                  @JavascriptInterface
                  public String download(String url, String name, String mime) {
                      JSONObject o = new JSONObject();
                      try {
                          Uri u = Uri.parse(url);
                          String sc = u.getScheme();
                          if (sc == null || !(sc.equals("http") || sc.equals("https")))
                              throw new IllegalArgumentException("Enlace no válido");
                          String file = cleanName(name);
                          if (file.isEmpty()) file = URLUtil.guessFileName(url, null, mime);
                          DownloadManager.Request r = new DownloadManager.Request(u);
                          r.setTitle(file);
                          r.setDescription("Nexora Download Plus");
                          r.addRequestHeader("User-Agent", WebSettings.getDefaultUserAgent(MainActivity.this));
                          r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          String sub = subFor(file, mime);
                          if (sub == null) sub = SUB_DOCS;
                          outDir(sub);
                          r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "Nexora/" + sub + "/" + file);
                          long id = dm.enqueue(r);
                          o.put("ok", true).put("id", id).put("file", file);
                      } catch (Exception e) {
                          try { o.put("ok", false).put("error", String.valueOf(e.getMessage())); } catch (Exception ignored) {}
                      }
                      return o.toString();
                  }

                  @JavascriptInterface
                  public String status(String idsCsv) {
                      JSONArray arr = new JSONArray();
                      Cursor c = null;
                      try {
                          String[] parts = idsCsv.split(",");
                          long[] ids = new long[parts.length];
                          for (int i = 0; i < parts.length; i++) ids[i] = Long.parseLong(parts[i].trim());
                          c = dm.query(new DownloadManager.Query().setFilterById(ids));
                          while (c != null && c.moveToNext()) {
                              JSONObject o = new JSONObject();
                              o.put("id", c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_ID)));
                              o.put("status", statusName(c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS))));
                              o.put("done", c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR)));
                              o.put("total", c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES)));
                              arr.put(o);
                          }
                      } catch (Exception ignored) {
                      } finally {
                          if (c != null) c.close();
                      }
                      return arr.toString();
                  }

