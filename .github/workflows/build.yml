          cat > android/app/src/main/java/com/nexora/download/LoginActivity.java <<'EOF'
          package com.nexora.download;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;

          /** Inicio de sesión en YouTube. Guarda la sesión en un archivo cookies.txt privado de la app. */
          public class LoginActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  int bg = Color.parseColor("#171C45");
                  float d = getResources().getDisplayMetrics().density;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#0E1230"));

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setBackgroundColor(bg);
                  int p = (int) (12 * d);
                  bar.setPadding(p, p, p, p);

                  TextView tv = new TextView(this);
                  tv.setText("Inicia sesión y luego toca Guardar.\nUsa una cuenta secundaria.");
                  tv.setTextColor(Color.parseColor("#EEF0FF"));
                  tv.setTextSize(13);
                  bar.addView(tv, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  Button save = new Button(this);
                  save.setText("Guardar");
                  save.setAllCaps(false);
                  save.setTextColor(Color.parseColor("#06261F"));
                  save.setBackgroundColor(Color.parseColor("#46E0C4"));
                  save.setOnClickListener(v -> saveSession());
                  bar.addView(save);

                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  root.addView(bar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  root.addView(web, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(root);

                  web.loadUrl("https://accounts.google.com/ServiceLogin?service=youtube&continue=https%3A%2F%2Fm.youtube.com%2F");
              }

              private void saveSession() {
                  CookieManager cm = CookieManager.getInstance();
                  cm.flush();
                  String c = cm.getCookie("https://www.youtube.com");
                  if (c == null || !(c.contains("SAPISID") || c.contains("__Secure-3PSID") || c.contains("LOGIN_INFO"))) {
                      Toast.makeText(this, "Primero termina de iniciar sesión en YouTube", Toast.LENGTH_LONG).show();
                      return;
                  }
                  long exp = System.currentTimeMillis() / 1000 + 180L * 24 * 3600;
                  StringBuilder sb = new StringBuilder("# Netscape HTTP Cookie File\n");
                  for (String part : c.split(";")) {
                      String kv = part.trim();
                      int i = kv.indexOf('=');
                      if (i <= 0) continue;
                      sb.append(".youtube.com\tTRUE\t/\tTRUE\t").append(exp).append('\t')
                        .append(kv.substring(0, i)).append('\t').append(kv.substring(i + 1)).append('\n');
                  }
                  File out = MainActivity.cookiesFile(this);
                  try (FileOutputStream os = new FileOutputStream(out)) {
                      os.write(sb.toString().getBytes(StandardCharsets.UTF_8));
                      Toast.makeText(this, "Sesión guardada", Toast.LENGTH_SHORT).show();
                      finish();
                  } catch (Exception e) {
                      Toast.makeText(this, "No se pudo guardar la sesión", Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
