                              i.setPackage(pkg);
                              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                              try { startActivity(i); return "ok"; } catch (Exception ignored) { /* sin filtro "Abrir con" */ }
                              // La app no declara "Abrir con": se abre directamente su pantalla principal con el archivo
                              Intent li = getPackageManager().getLaunchIntentForPackage(pkg);
                              if (li != null) {
                                  li.setAction(Intent.ACTION_VIEW);
                                  li.setDataAndType(u, mime);
                                  li.removeCategory(Intent.CATEGORY_LAUNCHER);
                                  li.putExtra("nexora_title", path != null ? new File(path).getName() : "");
                                  li.putExtra("nexora_path", path != null ? path : "");
                                  li.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                  try { startActivity(li); return "ok"; } catch (Exception ignored) {}
                              }
                          }
